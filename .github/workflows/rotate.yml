name: Rotate Posts

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rotate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          NEW_CHANNEL_ID: ${{ secrets.NEW_CHANNEL_ID }}
          OLD_CHANNEL_ID: ${{ secrets.OLD_CHANNEL_ID }}
        run: python fetch_and_post.py

      - name: Commit updated pool.json
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add pool.json
          git diff --cached --quiet || git commit -m "Update pool"
          git push
